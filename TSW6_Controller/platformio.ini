[env:lolin32]
platform = espressif32
board = lolin32
framework = arduino
monitor_speed = 115200
upload_speed = 115200
extra_scripts = pre:extra_script.py


upload_port = /dev/tty.usbserial-142320

build_flags =

  -std=gnu++14

board_build.filesystem = littlefs

lib_deps =
  WiFi
  DNSServer
  WebServer
  LittleFS
  bblanchon/ArduinoJson @ ^6.21.3
  robtillaart/MCP23S17
  ; adafruit/Adafruit GFX Library  ; Only needed if USEDISPLAY=1
  ; adafruit/Adafruit SH110X       ; Only needed if USEDISPLAY=1
